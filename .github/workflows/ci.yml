name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run audit
      # Every published verdict and every number in the README, re-derived from the raw outputs.
      - run: npm run reproduce

  # The container path the README offers: the same checks and reproduction on a pinned Node.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t doublecharge .
      - run: docker run --rm doublecharge
