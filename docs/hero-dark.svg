<text x="618" y="40" class="title">Card statement</text>
<text x="618" y="58" class="sub">What PayCo charged, as it happens</text>
<line x1="618" y1="74" x2="866" y2="74" stroke="#1b2b3a"/>
<g class="row" style="animation-name:s0"><text x="618" y="106" class="line" fill="#e6edf3">PAYCO *ORDER O1</text><text x="866" y="106" class="line" fill="#e6edf3" text-anchor="end">€25.99</text><text x="618" y="121" class="sub">charged, but the reply was lost</text></g>
<g class="row" style="animation-name:s1"><text x="618" y="148" class="line" fill="#ff7468">PAYCO *ORDER O1</text><text x="866" y="148" class="line" fill="#ff7468" text-anchor="end">€25.99</text><text x="618" y="163" class="sub" fill="#ff7468" style="fill:#ff7468">the same order, charged again</text></g>
<g class="row later" style="animation-name:t0"><line x1="618" y1="180" x2="866" y2="180" stroke="#e6edf3" stroke-width="2"/><text x="618" y="198" class="line" fill="#e6edf3">1 charge</text><text x="866" y="198" class="line total" fill="#e6edf3" text-anchor="end">€25.99</text></g>
<g class="row" style="animation-name:t1"><line x1="618" y1="180" x2="866" y2="180" stroke="#ff7468" stroke-width="2"/><text x="618" y="198" class="line" fill="#ff7468">2 charges</text><text x="866" y="198" class="line total" fill="#ff7468" text-anchor="end">€51.98</text></g>
<g class="stampbox"><rect x="626" y="310" width="232" height="52" rx="6" fill="#3a1d1f" fill-opacity="0.6" stroke="#ff7468" stroke-width="3"/><rect x="632" y="316" width="220" height="40" rx="4" fill="none" stroke="#ff7468" stroke-width="1.2"/><text x="742" y="342" text-anchor="middle" class="verdict" style="font:800 17px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;letter-spacing:1.5px" fill="#ff7468">CHARGED TWICE</text></g>
</svg>
