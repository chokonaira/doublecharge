.bt{font:600 13px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;fill:#14233d;}
.bs{font:11.5px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;fill:#56667a;}
.tag{font:700 12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;letter-spacing:.3px;}
.chip{font:11px ui-monospace, SF Mono, Menlo, Consolas, monospace;fill:#14233d;}
.mono{font:11px ui-monospace, SF Mono, Menlo, Consolas, monospace;fill:#56667a;}
.h{font:600 15px Iowan Old Style, Charter, Georgia, serif;fill:#14233d;}
.small{font:12px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;fill:#56667a;}
</style>
