<text x="186" y="34" text-anchor="middle" class="head" fill="#8db4f0">Request A</text><text x="186" y="49" text-anchor="middle" class="sub">sent by the caller</text><line x1="186" y1="60" x2="186" y2="418" stroke="#2c4052" stroke-width="1" stroke-dasharray="3 4"/>
<text x="308" y="34" text-anchor="middle" class="head" fill="#d1a3e8">Final press</text><text x="308" y="49" text-anchor="middle" class="sub">by the grader, at the end</text><line x1="308" y1="60" x2="308" y2="418" stroke="#2c4052" stroke-width="1" stroke-dasharray="3 4"/>
<text x="430" y="34" text-anchor="middle" class="svc" fill="#e6edf3">Db</text><line x1="430" y1="60" x2="430" y2="418" stroke="#2c4052" stroke-width="2"/>
<text x="552" y="34" text-anchor="middle" class="svc" fill="#e6edf3">PayCo</text><line x1="552" y1="60" x2="552" y2="418" stroke="#2c4052" stroke-width="2"/>
<g class="row" style="animation-name:r0"><text x="308" y="87" class="call" text-anchor="middle">get order:o1</text><line x1="186" y1="92" x2="422" y2="92" stroke="#8db4f0" stroke-width="2" stroke-dasharray="236" class="draw" style="animation-name:d0"/><path d="M421 87.5 L429 92 L421 96.5 Z" fill="#8db4f0"/><text x="308" y="106" class="res" text-anchor="middle">status: pending</text></g>
<g class="row" style="animation-name:r1"><text x="369" y="123" class="call" text-anchor="middle">createCharge €25.99 · no key</text><line x1="186" y1="128" x2="544" y2="128" stroke="#8db4f0" stroke-width="2" stroke-dasharray="358" class="draw" style="animation-name:d1"/><path d="M543 123.5 L551 128 L543 132.5 Z" fill="#8db4f0"/><text x="369" y="142" class="res bad" text-anchor="middle">processed, but the response was lost (timeout)</text></g>
<g class="row" style="animation-name:r2"><text x="125" y="159" class="call" text-anchor="middle">no answer</text><line x1="186" y1="164" x2="72" y2="164" stroke="#8db4f0" stroke-width="2" stroke-dasharray="114" class="draw" style="animation-name:d2"/><path d="M73 159.5 L65 164 L73 168.5 Z" fill="#8db4f0"/><text x="125" y="178" class="res bad" text-anchor="middle">timeout</text></g>
<g class="row" style="animation-name:r3"><text x="186" y="186" class="who" fill="#8db4f0" text-anchor="middle">sent again</text><text x="308" y="195" class="call" text-anchor="middle">get order:o1</text><line x1="186" y1="200" x2="422" y2="200" stroke="#8db4f0" stroke-width="2" stroke-dasharray="236" class="draw" style="animation-name:d3"/><path d="M421 195.5 L429 200 L421 204.5 Z" fill="#8db4f0"/><text x="308" y="214" class="res" text-anchor="middle">status: pending</text></g>
<g class="row" style="animation-name:r4"><text x="369" y="231" class="call" text-anchor="middle">createCharge €25.99 · no key</text><line x1="186" y1="236" x2="544" y2="236" stroke="#8db4f0" stroke-width="2" stroke-dasharray="358" class="draw" style="animation-name:d4"/><path d="M543 231.5 L551 236 L543 240.5 Z" fill="#8db4f0"/><text x="369" y="250" class="res" text-anchor="middle">processed</text></g>
<g class="row" style="animation-name:r5"><text x="308" y="267" class="call" text-anchor="middle">set order:o1</text><line x1="186" y1="272" x2="422" y2="272" stroke="#8db4f0" stroke-width="2" stroke-dasharray="236" class="draw" style="animation-name:d5"/><path d="M421 267.5 L429 272 L421 276.5 Z" fill="#8db4f0"/><text x="308" y="286" class="res" text-anchor="middle">status → paid</text></g>
<g class="row" style="animation-name:r6"><text x="125" y="303" class="call" text-anchor="middle">answer</text><line x1="186" y1="308" x2="72" y2="308" stroke="#8db4f0" stroke-width="2" stroke-dasharray="114" class="draw" style="animation-name:d6"/><path d="M73 303.5 L65 308 L73 312.5 Z" fill="#8db4f0"/><text x="125" y="322" class="res" text-anchor="middle">paid</text></g>
<g class="row" style="animation-name:r7"><text x="369" y="339" class="call" text-anchor="middle">get order:o1</text><line x1="308" y1="344" x2="422" y2="344" stroke="#d1a3e8" stroke-width="2" stroke-dasharray="114" class="draw" style="animation-name:d7"/><path d="M421 339.5 L429 344 L421 348.5 Z" fill="#d1a3e8"/><text x="369" y="358" class="res" text-anchor="middle">status: paid</text></g>
